[project]
name = "kord"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "httpx>=0.27",
  "librosa>=0.10", "numpy>=1.26", "soundfile>=0.12", "yt-dlp>=2024.1",
  # FastAPI's own required parser for File/UploadFile (multipart/form-data).
  # Not an added capability — /api/import cannot decode a file upload
  # without it, since this is what Starlette itself calls to do so.
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
btc = ["torch>=2.2"]
tab = [
  "basic-pitch==0.4.0",
  # basic-pitch pins resampy<0.4.3, and that pin cannot be honoured here:
  # resampy 0.4.2 imports pkg_resources, which setuptools removed in 81.
  # 0.4.3 exists precisely to drop that import, so the upper bound is stale
  # rather than protective. Overriding it deliberately, because the
  # alternative is pinning setuptools back below 81 for the whole project.
  "resampy>=0.4.3",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"
