<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Kord's mark: the wordmark compressed to what survives at 16px, a heavy
       K and the brass full stop. Drawn as paths rather than set in Bricolage
       Grotesque, because a favicon cannot depend on a webfont loading.
       Colours are the app's own ink, chalk and brass. -->
  <title>Kord</title>
  <rect width="32" height="32" rx="7" fill="#0b0d10"/>
  <g stroke="#f4f1ea" stroke-width="4.2" stroke-linecap="round" fill="none">
    <path d="M9.4 6.8 V25.2"/>
    <path d="M9.4 16.4 L19.6 7.6"/>
    <path d="M9.4 16.4 L20.1 25.2"/>
  </g>
  <circle cx="25.6" cy="23.4" r="2.5" fill="#c8a24a"/>
</svg>
